[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mobilegui-ltm"
version = "0.2.0"
description = "Pluggable long-term memory SDK for mobile GUI agents (write, retrieve, inject across pass@k attempts)."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
  { name = "MobileGUI-LTM contributors" },
]
keywords = [
  "mobile",
  "gui",
  "agent",
  "long-term-memory",
  "android",
  "pass-at-k",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0",
]
embed = [
  "sentence-transformers>=2.2",
]
vector = [
  "sentence-transformers>=2.2",
]

[project.urls]
Homepage = "https://github.com/Lxr-max/mobilegui-ltm"
Repository = "https://github.com/Lxr-max/mobilegui-ltm"
Issues = "https://github.com/Lxr-max/mobilegui-ltm/issues"

[project.scripts]
mobilegui-ltm-demo = "mobilegui_ltm.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mobilegui_ltm = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
